<!doctype html>
<!--
  反 devtools 拦截后的落地页。刻意做成完全独立、自包含的静态文件：
  - 放在 public/ 下，Vite 原样拷进 dist 根，配 base:'./' 子路径部署也能命中；
  - 内联样式、不依赖任何构建产物，即使主应用脚本被拦下也照常显示；
  - 配色沿用 src/style.css 的深色变量值（这里无法 import，只能写死同款色）。
  不放「返回」链接：放了等于自己拆台。改地址栏仍能回主页，属软防护预期内。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>访问已终止</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e1621;
        color: #e9edf0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .box {
        text-align: center;
        padding: 32px;
        max-width: 420px;
      }
      .icon {
        font-size: 56px;
        line-height: 1;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        color: #7f91a4;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="icon">🚫</div>
      <h1>访问已终止</h1>
      <p>检测到开发者工具已打开，为保护本页面，访问已被中断。请关闭开发者工具后重新访问。</p>
    </div>
  </body>
</html>
